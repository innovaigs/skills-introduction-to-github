<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZenReader</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <textarea id="text-input" placeholder="Paste or type your text here. ZenReader will read it aloud."></textarea>
        <div id="text-display" aria-live="polite" style="display: none;"></div> <!-- For highlighted text -->
        <button id="read-button" class="hidden">Read</button>
    </div>
    <script src="script.js"></script>
</body>
</html>
